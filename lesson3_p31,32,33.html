<div id="top"><div class="tb"><span id="lv"></span><span><input id="adm" class="mini" type="password" name="adm-code" autocomplete="new-password" data-lpignore="true" data-1p-ignore placeholder="🔒" size="4"> <select id="jump" class="mini"></select> <label class="sw"><input type="checkbox" id="trt" checked><span class="sl"></span> Перевод</label><button id="pt" class="mini">Пиньинь: вкл</button></span></div><div class="pb"><i id="bar"></i></div></div>

<script>
const $=s=>document.querySelector(s);
const rb=(h,p)=>`<ruby>${h}<rt>${p}</rt></ruby>`;
const sp=k=>k.map(x=>x[0]).join('');
const say=t=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.8;speechSynthesis.speak(u)}catch(e){}};
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const T=(k,e='')=>k.map(x=>rb(x[0],x[1])).join('')+e;

const st={ok:0,tot:0};
let KEYH=null;document.addEventListener('keydown',e=>KEYH&&KEYH(e));
let GEL=null;
const M=h=>{KEYH=null;if(GEL){clearInterval(GEL._iv);cancelAnimationFrame(GEL._raf);clearTimeout(GEL._to);GEL=null}$('#m').innerHTML=h;scrollTo(0,0)};
const lv=t=>{$('#lv').textContent=t;$('#bar').style.width='0'};
const go=(h,b,f)=>{M(h+`<button class="btn" id="go">${b}</button>`);$('#go').onclick=f};
function fb(ok,html,cb){$('#fb').innerHTML=`<div class="fb ${ok?'g':'r'}">${ok?'✅ Верно!':'❌ Правильно так:'}<div>${html}</div></div>`+(ok?'':'<button class="btn" id="nx">Дальше</button>');if(ok)setTimeout(()=>cb(true),900);else $('#nx').onclick=()=>cb(false)}
function run(tasks,show,done){const q=tasks.map(t=>({t,m:0})),n=q.length;let f=0;
 const nx=()=>{$('#bar').style.width=(100*f/n)+'%';if(!q.length)return done();const c=q[0];
  let used=0;show(c.t,ok=>{if(used)return;used=1;if(ok){q.shift();f++;st.tot++;if(!c.m)st.ok++}else{c.m++;q.push(q.shift())}nx()});
  const b=document.createElement('button');b.className='mini skip';b.textContent='⏭ пропустить';b.onclick=()=>{if(used)return;used=1;q.shift();f++;nx()};$('#m').append(b)};nx()}


// ===== ДАННЫЕ УРОКА 3 · страницы 31–33 · 从…到… =====
// W: 7 новых слов [иероглиф, пиньинь, перевод, эмодзи]
const W=[["从","cóng","от, с (начало)","🅰️"],["到","dào","до (конец)","🅱️"],["点","diǎn","час (по часам)","🕒"],["半","bàn","половина","🌗"],["上午","shàngwǔ","утро (до полудня)","🌅"],["下午","xiàwǔ","день (после полудня)","🌇"],["足球","zúqiú","футбол","⚽"]];
// WR: слова прошлых уроков, которые есть на этих страницах (только для игр)
const WR=[["比赛","bǐsài","соревнование, матч"],["结束","jiéshù","заканчиваться"],["已经","yǐjīng","уже"],["了","le",""],["吗","ma",""]];
// X: слова страницы, которые читаем с подсказкой, но не заучиваем
const X=[["家","jiā","дом"],["学校","xuéxiào","школа"],["操场","cāochǎng","спортплощадка"],["九","jiǔ","девять"],["十二","shí’èr","двенадцать"],["三","sān","три"],["四","sì","четыре"],["八","bā","восемь"],["十","shí","десять"],["8","bā",""],["10","shí",""],["今天","jīntiān","сегодня"],["晚上","wǎnshang","вечер"],["我","wǒ","я"],["你","nǐ","ты"],["她","tā","она"],["他","tā","он"],["来","lái","приходить"],["看","kàn","смотреть"],["这儿","zhèr","здесь"],["干什么","gàn shénme","что делать"],["什么时候","shénme shíhou","когда"],["什么","shénme","что"],["为什么","wèishénme","почему"],["男生","nánshēng","мальчик"],["说","shuō","говорить"],["有","yǒu","есть"],["里","lǐ","в"],["的","de",""],["可以","kěyǐ","можно"],["太可惜了","tài kěxī le","как жаль"],["足球赛","zúqiúsài","футбольный матч"],["电视","diànshì","телевизор"],["没有","méiyǒu","нет"],["喜欢","xǐhuan","любить"],
["这","zhè",""],["是","shì",""],["做","zuò",""],["家具","jiājù","мебель"],["木材","mùcái","древесина"],["不","bú",""],["壁炉","bìlú","камин"],["用","yòng",""],["木柴","mùchái","дрова"],["姐姐","jiějie","старшая сестра"],["那个","nàge",""],["诗人","shīrén","поэт"],["私人","sīrén","личный"],["秘书","mìshū","секретарь"],["姓","xìng",""],["臧","zāng","Цзан"],["张","zhāng","Чжан"],["杂志","zázhì","журнал"],["杂技","zájì","цирковое представление"],["送","sòng",""],["一","yì",""],["本","běn",""],["跟","gēn",""],["一起","yìqǐ",""],["，","",""],["；","",""]];
const P=Object.fromEntries([...W,...WR,...X].map(w=>[w[0],w[1]]));
const Z=s=>s.split(' ').map(h=>[h,P[h]||'']);
const mk=(ru,s,e,d)=>({ru,k:Z(s),e,d});
// S: фразы для сборки (4 примера со с.31 + 3 похожих). d — «ловушка»
const S=[mk("С девяти до двенадцати утра.","从 上午 九 点 到 十二 点","。",["下午"]),mk("С половины четвёртого до половины пятого дня.","从 下午 三 点 半 到 四 点 半","。",["上午"]),mk("Из дома в школу.","从 家 到 学校","。",["操场"]),mk("Из школы на спортплощадку.","从 学校 到 操场","。",["家"]),mk("С восьми до десяти утра.","从 上午 八 点 到 十 点","。",["下午"]),mk("С трёх до четырёх дня.","从 下午 三 点 到 四 点","。",["上午"]),mk("Футбольный матч с трёх до четырёх дня.","足球 比赛 从 下午 三 点 到 四 点","。",["半"])];
const LP=['从','到','点','半','上午','下午','足球','家','学校','操场','九','十二','三','四','八','十'];
// данные для игр: слова урока + повторение; предложения паровозика; пиньинь для плиток-«не слов»
const WG=[...W.map(w=>[w[0],w[1],w[2]]),...WR.slice(0,3)];
const GS=[[['从','上午','九','点','到','十二','点'],'С девяти до двенадцати утра.'],[['从','下午','三','点','半','到','四','点','半'],'С половины четвёртого до половины пятого дня.'],[['从','家','到','学校'],'Из дома в школу.'],[['从','学校','到','操场'],'Из школы на спортплощадку.'],[['足球','比赛','从','下午','三','点','到','四','点'],'Футбольный матч с трёх до четырёх дня.']];
const PX={'九':'jiǔ','十二':'shí’èr','三':'sān','四':'sì','家':'jiā','学校':'xuéxiào','操场':'cāochǎng'};
// C: иероглифы для прописи, по одному [знак, пиньинь, слово-источник]
const C=[['从','cóng','从'],['到','dào','到'],['点','diǎn','点'],['半','bàn','半'],['上','shàng','上午'],['下','xià','下午'],['午','wǔ','上午'],['足','zú','足球'],['球','qiú','足球']];

function tBuild(t,res,opt={}){
 const n=opt.n||1,have=t.k.map(x=>x[0]),dd=(t.d||[]).filter(h=>!have.includes(h)),rest=shuf(LP.filter(h=>!have.includes(h)&&!dd.includes(h)));
 const dis=[...dd,...rest].slice(0,n).map(h=>[h,P[h]]);
 let pool=shuf([...t.k,...dis]).map(x=>({x})),ans=[],lock=0;
 M(`${opt.pre||''}<p class="ru tq" onclick="this.classList.toggle('on')">${t.ru}</p><div id="an" class="zone"></div><div id="pl" class="zone"></div><button class="btn" id="ck">Проверить</button><div id="fb"></div>`);
 const tile=(z,f)=>{const b=document.createElement('button');b.className='tile';b.innerHTML=rb(z.x[0],z.x[1]);b.onclick=()=>{if(!lock){say(z.x[0]);f()}};return b};
 const draw=()=>{const a=$('#an'),p=$('#pl');a.innerHTML=p.innerHTML='';
  ans.forEach(z=>a.append(tile(z,()=>{ans=ans.filter(y=>y!==z);pool.push(z);draw()})));
  pool.forEach(z=>p.append(tile(z,()=>{pool=pool.filter(y=>y!==z);ans.push(z);draw()})))};
 draw();
 $('#ck').onclick=()=>{if(lock||!ans.length)return;lock=1;$('#ck').disabled=true;fb(sp(ans.map(z=>z.x))==sp(t.k),T(t.k,t.e),res)}}

// ===== навигация: порядок этапов =====
let CUR=0;

const TM={a:'āáǎà',e:'ēéěè',o:'ōóǒò',i:'īíǐì',u:'ūúǔù',v:'ǖǘǚǜ'};
function tonify(s,t){let k=-1;if(t>=1&&t<=4){k=s.search(/[ae]/);if(k<0&&s.includes('ou'))k=s.indexOf('o');if(k<0)for(let j=s.length-1;j>=0;j--)if(TM[s[j]]){k=j;break}}return(k<0?s:s.slice(0,k)+TM[s[k]][t-1]+s.slice(k+1)).replace(/v/g,'ü')}
const pyR=b=>b.replace(/([a-z]+)([0-5]?)/g,(m,s,t)=>tonify(s,+t));
const KB=['qwertyuiop','asdfghjkl','zxcvbnm'];

 box.innerHTML=KB.map(r=>`<div class=kr>${[...r].map(c=>`<button class=kk data-k=${c}>${c=='v'?'ü':c}</button>`).join('')}</div>`).join('')+`<div class=kr>${tb.map((x,i)=>`<button class="kk kt" data-k=${i+1}>${x}</button>`).join('')}<button class="kk kt" data-k="<">⌫</button></div>`;
