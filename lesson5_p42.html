const TM={a:'āáǎà',e:'ēéěè',o:'ōóǒò',i:'īíǐì',u:'ūúǔù',v:'ǖǘǚǜ'};
function tonify(s,t){let k=-1;if(t>=1&&t<=4){k=s.search(/[ae]/);if(k<0&&s.includes('ou'))k=s.indexOf('o');if(k<0)for(let j=s.length-1;j>=0;j--)if(TM[s[j]]){k=j;break}}return(k<0?s:s.slice(0,k)+TM[s[k]][t-1]+s.slice(k+1)).replace(/v/g,'ü')}
const pyR=b=>b.replace(/([a-z]+)([0-5]?)/g,(m,s,t)=>tonify(s,+t));
const KB=['qwertyuiop','asdfghjkl','zxcvbnm'];

 const press=k=>{if(k=='<'){if(buf)buf=buf.slice(0,-1);else if(onBack)onBack()}else if(/\d/.test(k)){if(/[a-z]\d?$/.test(buf))buf=buf.replace(/\d$/,'')+k}else buf+=k;onCh(buf)};

 return{press,get:()=>buf,set:v=>{buf=v;onCh(buf)}}}

// слово или слог, как набирается на клавиатуре (для выбора заданий печати)
const TYK={'巴西队':'ba1xi1dui4','赢':'ying2','输':'shu1','了':'le5','老师':'lao3shi1','生气':'sheng1qi4','舞会':'wu3hui4','结束':'jie2shu4','开始':'kai1shi3','刘老师':'liu2lao3shi1','给':'gei3','我':'wo3','他':'ta1','两':'liang3','张':'zhang1','票':'piao4','歌星':'ge1xing1','电影':'dian4ying3','恐怖':'kong3bu4','音乐会':'yin1yue4hui4','就要':'jiu4yao4','古典':'gu3dian3','太':'tai4','好':'hao3','精彩':'jing1cai3','比赛':'bi3sai4','摇滚':'yao2gun3','有趣':'you3qu4','民族':'min2zu2','已经':'yi3jing1','从':'cong2','点':'dian3','到':'dao4','七':'qi1','九':'jiu3','六':'liu4','八':'ba1','三':'san1','五':'wu3','十':'shi2','四':'si4','部':'bu4'};
const cands=b=>{if(!b)return[];const L=b.replace(/\d/g,''),ds=b.replace(/\D/g,''),r=[];for(const key in K){if(key.replace(/\d/g,'')==L&&key.replace(/\D/g,'').startsWith(ds))r.push(...K[key])}return r};
function tIME(t,res){
 M(`<p class="ru tq" onclick="this.classList.toggle('on')">${t.ru}</p><div id="out" class="pd"></div><div id="pd" class="pd" style="font-size:1.3rem"></div><div id="cd" class="zone"></div><div id="kb"></div><button class="btn" id="ck">Проверить</button><div id="fb"></div>`);
 let out='',done=0;
 const pick=c=>{if(done)return;out+=c;k.set('')};
 const draw=b=>{if(done)return;$('#out').textContent=out||'…';$('#pd').textContent=pyR(b);const cd=$('#cd');cd.innerHTML='';cands(b).forEach(c=>{const x=document.createElement('button');x.className='tile';x.textContent=c;x.onclick=()=>pick(c);cd.append(x)})};
 const k=mkKB($('#kb'),draw,()=>{out=out.slice(0,-1);draw(k.get())});
 draw('');
 const chk=()=>{if(done||!out)return;done=1;$('#ck').disabled=true;fb(out==t.h,t.ans,res)};
 $('#ck').onclick=chk;KEYH=e=>{if(!done)keyH(k,chk,()=>{const c=cands(k.get())[0];if(c)pick(c)})(e)}}

 const tw=W.filter(w=>w[0] in TYK&&w[0]!='了'),ts=SS.flat().filter(t=>t.k.every(x=>x[0] in TYK));
 go(`<h1>⌨️ Печатаем иероглифы</h1><p>Как на настоящей китайской клавиатуре: набираешь пиньинь с тонами, внизу выбираешь нужный иероглиф. Слово можно набрать целиком (kai1shi3) или по слогам. С физической клавиатуры: цифры 1-5 для тона, пробел выбирает первый вариант.</p>`,'Поехали',()=>run([...shuf(tw).slice(0,5).map(w=>({ru:w[3]+' '+w[2],h:w[0],ans:rb(w[0],w[1])})),...shuf(ts).slice(0,3).map(s=>({ru:s.ru,h:sp(s.k),ans:T(s.k,s.e)}))],tIME,()=>nx('sT')))}
function sM(){lv('Сопоставление');const mw=shuf(W.filter(w=>!['了','啦'].includes(w[0]))),rounds=[mw.slice(0,6),mw.slice(6,12),mw.slice(12,18)];let r=0;
 const round=()=>{const ws=rounds[r];let sel=null,left=ws.length;const bad=new Set();
  M(`<p>Нажми иероглиф, потом его значение.</p><div class=mt><div id=ml></div><div id=mr></div></div>`);$('#bar').style.width=(100*r/rounds.length)+'%';
  const pick=(b,w,side)=>{if(side=='l')say(w[0]);if(sel&&sel.side==side)sel.b.classList.remove('sel');
   if(!sel||sel.side==side){sel={b,w,side};b.classList.add('sel');return}
   const a=sel.b,v=sel.w;sel=null;a.classList.remove('sel');
   if(v===w){[a,b].forEach(x=>{x.classList.add('ok');x.disabled=true});st.tot++;if(!bad.has(w[0]))st.ok++;if(!--left)setTimeout(()=>{r++;r<rounds.length?round():nx('sM')},700)}
   else{bad.add(w[0]);bad.add(v[0]);a.classList.add('no');b.classList.add('no');setTimeout(()=>{a.classList.remove('no');b.classList.remove('no')},500)}};
  [['#ml','l'],['#mr','r']].forEach(([id,side])=>shuf(ws).forEach(w=>{const b=document.createElement('button');b.className='tile mb';b.innerHTML=side=='l'?rb(w[0],w[1]):`${w[3]} ${w[2]}`;b.onclick=()=>pick(b,w,side);$(id).append(b)}));
  const sk=document.createElement('button');sk.className='mini skip';sk.textContent='⏭ пропустить';sk.onclick=()=>nx('sM');$('#m').append(sk)};
 round()}
